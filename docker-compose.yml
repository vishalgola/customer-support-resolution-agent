services:
  db:
    image: pgvector/pgvector:pg16
    container_name: support_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_pw}
      POSTGRES_DB: ${POSTGRES_DB:-support_agent}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: